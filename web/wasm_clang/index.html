<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ganbare Natsuki-san</title>
  <style>
    :root {
      color-scheme: dark;
      background: #050505;
      --gns-aspect: 5 / 3;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
    }

    body {
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
    }

    #gns-canvas {
      display: block;
      width: min(100vw, calc(100vh * var(--gns-aspect)));
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: var(--gns-aspect);
      background: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      outline: none;
      touch-action: none;
    }

    #status {
      position: fixed;
      left: 0.75rem;
      bottom: 0.5rem;
      font: 12px/1.4 system-ui, sans-serif;
      color: #ccc;
      opacity: 0.85;
      user-select: none;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      right: 0.75rem;
      top: 0.75rem;
      max-width: min(35rem, calc(100vw - 1.5rem));
      max-height: calc(100vh - 1.5rem);
      overflow: auto;
      border-radius: 0.45rem;
      background: rgb(0 0 0 / 72%);
      color: #ddd;
      font: 12px/1.35 system-ui, sans-serif;
      box-shadow: 0 0.35rem 1.2rem rgb(0 0 0 / 55%);
      user-select: none;
    }

    #controls:not([open]) {
      background: rgb(0 0 0 / 42%);
      box-shadow: none;
    }

    #controls > summary {
      cursor: pointer;
      padding: 0.4rem 0.55rem;
      list-style: none;
      color: #eee;
      font-weight: 700;
    }

    #controls > summary::-webkit-details-marker {
      display: none;
    }

    .controls-body {
      padding: 0 0.65rem 0.65rem;
    }

    .controls-body p {
      margin: 0.4rem 0 0.55rem;
    }

    .controls-actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin: 0.45rem 0 0.65rem;
    }

    #capture-box {
      margin: 0.45rem 0 0.65rem;
      padding: 0.45rem 0.55rem;
      border: 1px solid rgb(255 255 255 / 24%);
      border-radius: 0.35rem;
      background: rgb(255 255 255 / 10%);
    }

    #capture-box[hidden] {
      display: none;
    }

    #capture-status {
      margin-bottom: 0.4rem;
      color: #fff;
    }

    #bindings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    #bindings-table th,
    #bindings-table td {
      border-top: 1px solid rgb(255 255 255 / 15%);
      padding: 0.25rem 0.3rem;
      vertical-align: top;
      text-align: left;
      white-space: nowrap;
    }

    #bindings-table th {
      color: #fff;
      font-weight: 700;
    }

    .small-button {
      margin: 0 0.2rem 0.2rem 0;
      border: 1px solid rgb(255 255 255 / 30%);
      border-radius: 0.3rem;
      background: rgb(255 255 255 / 12%);
      color: #eee;
      padding: 0.12rem 0.35rem;
      font: inherit;
      cursor: pointer;
    }

    .small-button:hover,
    .small-button:focus-visible {
      background: rgb(255 255 255 / 22%);
    }

    #touch-controls {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      display: flex;
      gap: min(8vw, 3rem);
      align-items: end;
      opacity: 0.42;
      user-select: none;
      touch-action: none;
    }

    #touch-controls:focus-within,
    #touch-controls:hover {
      opacity: 0.75;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 2.5rem);
      grid-template-rows: repeat(3, 2.5rem);
      gap: 0.18rem;
    }

    .action-pad {
      display: grid;
      grid-template-columns: repeat(2, 2.7rem);
      grid-template-rows: repeat(2, 2.7rem);
      gap: 0.35rem;
    }

    .sys-pad {
      display: flex;
      gap: 0.35rem;
      align-self: center;
    }

    [data-gns-button] {
      border: 1px solid rgb(255 255 255 / 35%);
      border-radius: 0.45rem;
      background: rgb(0 0 0 / 55%);
      color: #eee;
      min-width: 2.5rem;
      min-height: 2.5rem;
      padding: 0 0.45rem;
      font: 600 12px/1 system-ui, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    [data-gns-button]:active {
      background: rgb(255 255 255 / 25%);
    }

    @media (pointer: fine) {
      #touch-controls {
        display: none;
      }
    }

    @media (max-width: 720px) {
      #controls[open] {
        left: 0.75rem;
        right: 0.75rem;
        max-width: none;
      }

      #bindings-table th,
      #bindings-table td {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <canvas id="gns-canvas" width="400" height="240" tabindex="0" aria-label="Ganbare Natsuki-san game canvas"></canvas>

  <details id="controls">
    <summary>Controls</summary>
    <div class="controls-body">
      <p>The panel is collapsed by default so it does not cover the game. Keyboard, Gamepad API controllers, and touch buttons are remappable here.</p>
      <div class="controls-actions">
        <button id="reset-bindings" class="small-button" type="button">Reset defaults</button>
        <button id="close-controls" class="small-button" type="button">Close</button>
      </div>
      <div id="capture-box" hidden>
        <div id="capture-status"></div>
        <button id="cancel-capture" class="small-button" type="button">Cancel remap</button>
      </div>
      <table id="bindings-table">
        <thead>
          <tr>
            <th>Game control</th>
            <th>Keyboard</th>
            <th></th>
            <th>Gamepad</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="binding-rows"></tbody>
      </table>
    </div>
  </details>

  <div id="touch-controls" aria-label="On-screen controls">
    <div class="dpad">
      <span></span><button type="button" data-gns-button="UP">↑</button><span></span>
      <button type="button" data-gns-button="LEFT">←</button><span></span><button type="button" data-gns-button="RIGHT">→</button>
      <span></span><button type="button" data-gns-button="DOWN">↓</button><span></span>
    </div>
    <div class="sys-pad">
      <button type="button" data-gns-button="SELECT">SEL</button>
      <button type="button" data-gns-button="START">STA</button>
    </div>
    <div class="action-pad">
      <button type="button" data-gns-button="Y">C</button>
      <button type="button" data-gns-button="B">V</button>
      <button type="button" data-gns-button="A">Z</button>
      <button type="button" data-gns-button="X">X</button>
    </div>
  </div>
  <div id="status">Loading…</div>
  <script src="gns_wasm.js"></script>
</body>
</html>
